services:
  db:
    image: postgres:16-alpine
    container_name: apex20-db
    environment:
      POSTGRES_USER: apex20
      POSTGRES_PASSWORD: password
      POSTGRES_DB: apex20
    ports:
      - "5420:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex20"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:16-alpine
    container_name: apex20-db-test
    environment:
      POSTGRES_USER: apex20
      POSTGRES_PASSWORD: password
      POSTGRES_DB: apex20_test
    ports:
      - "5421:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex20 -d apex20_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: apex20-cache
    ports:
      - "6320:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: apex20-prometheus
    ports:
      - "9020:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - db
      - cache

  grafana:
    image: grafana/grafana:latest
    container_name: apex20-grafana
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus

  web:
    image: node:24-bookworm-slim
    container_name: apex20-web
    working_dir: /app
    volumes:
      - ../apex20-web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "3020:3000"
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - INTERNAL_API_URL=http://apex20-backend:8787
      - NEXT_PUBLIC_API_URL=/connect
    command: sh -c "npm install && npx next dev -H 0.0.0.0 --webpack"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: apex20-backend
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../apex20-backend:/workspace/apex20-backend
      - go-cache:/home/dev/go
    working_dir: /workspace/apex20-backend
    ports:
      - "8787:8787"
    env_file:
      - ../apex20-backend/.env
    environment:
      DATABASE_URL: postgres://apex20:password@db:5432/apex20?sslmode=disable
      REDIS_URL: redis://cache:6379
      PORT: "8787"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    command: go run ./cmd/api/...

  tooling:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: apex20-tooling
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ..:/workspace
      - go-cache:/home/dev/go
    working_dir: /workspace
    environment:
      DATABASE_URL: postgres://apex20:password@db-test:5432/apex20_test
      REDIS_URL: redis://cache:6379
      PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-browsers
      E2E_BASE_URL: http://apex20-web:3000
    depends_on:
      db-test:
        condition: service_healthy
      cache:
        condition: service_healthy
    command: sleep infinity

volumes:
  pgdata:
  pgdata-test:
  grafana-data:
  go-cache:
  web-node-modules:
